spring.datasource.url=jdbc:postgresql://postgres-spring.cjeoia6wgtog.ap-southeast-2.rds.amazonaws.com:5432/postgres
spring.datasource.username=${RDS_USERNAME:your_rds_username}
spring.datasource.password=${RDS_PASSWORD:your_rds_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=15

# Logging
logging.level.com.example.CampusConnect=INFO
logging.level.org.hibernate.SQL=WARN

# Cookies
cookie.secure=true

# JWT (optional)
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# Disable devtools
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false