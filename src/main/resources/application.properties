# =====================================
# APPLICATION
# =====================================
spring.application.name=campusconnect
server.port=8080

# =====================================
# ACTIVE PROFILE
# =====================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =====================================
# DATABASE (DEFAULT - can override in prod)
# =====================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9000/campus_connect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:khushi}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA COMMON SETTINGS
# =====================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =====================================
# SQL INIT
# =====================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.sql.init.encoding=UTF-8

# =====================================
# LOGGING (BASE LEVEL)
# =====================================
logging.level.root=INFO

# =====================================
# ACTUATOR
# =====================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

info.app.name=CampusConnect
info.app.description=Student platform for courses, hackathons, internships & scholarships
info.app.version=1.0.0

# =====================================
# SWAGGER / OPENAPI
# =====================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =====================================
# JWT CONFIGURATION
# =====================================
jwt.secret=${JWT_SECRET:this_is_a_super_secure_32_character_secret_key_123}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =====================================
# COOKIE CONFIGURATION
# =====================================
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Strict}
cookie.domain=${COOKIE_DOMAIN:}
